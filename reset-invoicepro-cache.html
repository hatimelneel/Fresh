<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Pro Cache Reset</title>
<style>
body{font-family:-apple-system,Arial;background:#f3f6fb;color:#123f93;padding:30px;text-align:center}
.card{max-width:520px;margin:60px auto;background:#fff;padding:28px;border-radius:18px}
</style>
</head>
<body>
<div class="card">
<h2>Invoice Pro</h2>
<p>Clearing old app cache…</p>
</div>
<script>
(async function(){
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){try{await r.unregister()}catch(e){}}
    }
    if("caches" in window){
      const keys=await caches.keys();
      for(const k of keys){if(/invoicepro/i.test(k))try{await caches.delete(k)}catch(e){}}
    }
  }catch(e){}
  location.replace("stable-20260910.html?clean=1");
})();
</script>
</body>
</html>
